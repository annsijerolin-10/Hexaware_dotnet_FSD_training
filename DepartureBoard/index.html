<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Departure Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Airport Departure Board</h1>

<div class="header">
    <h2 id="clock"></h2>
    <h3 id="summary"></h3>
</div>

<div class="buttons">
    <button id="addBtn">Add Departure</button>
    <button id="resetBtn">Reset</button>
</div>
<div class="row heading">
    <div>TIME</div>
    <div>FLIGHT</div>
    <div>DESTINATION</div>
    <div>GATE</div>
    <div>STATUS</div>
</div>

<div class="board" id="board"></div>

<div class="board" id="board"></div>

<script src="script.js"></script>

</body>
</html>
